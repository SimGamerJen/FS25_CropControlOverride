name: Release Crop Control Override

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release/tag version
        required: true
        default: 2.1.0.0-beta.1
      target_ref:
        description: Branch, tag or commit to package
        required: true
        default: release/v2.1.0.0-beta.1
      release_title:
        description: GitHub release title
        required: true
        default: Crop Control Override 2.1.0.0 Beta 1
      notes_file:
        description: Release notes file on target ref
        required: true
        default: BETA1_RELEASE_NOTES.md
      prerelease:
        description: Publish as a GitHub pre-release
        required: true
        type: boolean
        default: true
  push:
    branches:
      - release/v2.1.0.0-beta.1
    paths:
      - .release/READY

permissions:
  contents: write

concurrency:
  group: cco-release
  cancel-in-progress: false

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      RELEASE_VERSION: ${{ inputs.version || '2.1.0.0-beta.1' }}
      TARGET_REF: ${{ inputs.target_ref || github.ref_name }}
      RELEASE_TITLE: ${{ inputs.release_title || 'Crop Control Override 2.1.0.0 Beta 1' }}
      NOTES_FILE: ${{ inputs.notes_file || 'BETA1_RELEASE_NOTES.md' }}
      PRERELEASE: ${{ github.event_name == 'push' || inputs.prerelease }}

    steps:
      - name: Check out requested release source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 0

      - name: Materialise staged release source
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G '.release/source.part.*' > /dev/null; then
            cat .release/source.part.* > /tmp/cco-source.b64
            base64 --decode /tmp/cco-source.b64 > /tmp/cco-source.zip
            rm -rf /tmp/cco-source
            mkdir -p /tmp/cco-source
            unzip -q /tmp/cco-source.zip -d /tmp/cco-source
            cp -a /tmp/cco-source/. ./
            rm -rf .release

            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m 'Promote CCO 2.1.0.0-beta.1 release source [skip ci]'
              git push origin HEAD:"${TARGET_REF}"
            fi
          fi

      - name: Validate release source
        shell: bash
        run: |
          set -euo pipefail
          test -f "$NOTES_FILE"
          python - <<'PY'
          import os
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          version = os.environ['RELEASE_VERSION']
          required_xml = [
              'modDesc.xml',
              'gui/CropControlOverrideMenu.xml',
              'gui/guiProfiles.xml',
              'l10n/l10n_en.xml',
              'l10n/l10n_de.xml',
              'l10n/l10n_fr.xml',
              'templates/customRegionalProfile.xml',
          ]
          for path in required_xml:
              ET.parse(path)

          mod_version = ET.parse('modDesc.xml').getroot().findtext('version')
          if mod_version != '2.1.0.0':
              raise SystemExit(f'Unexpected modDesc version: {mod_version!r}')

          runtime = Path('scripts/CropControlOverride.lua').read_text(encoding='utf-8')
          match = re.search(r'VERSION\s*=\s*"([^"]+)"', runtime)
          if match is None or match.group(1) != version:
              raise SystemExit(f'Unexpected runtime version: {match.group(1) if match else None!r}')
          PY

          if test -f tools/check_fsm_compat.py; then
            python tools/check_fsm_compat.py
          fi

      - name: Build Farming Simulator mod ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -f FS25_CropControlOverride.zip
          zip -r FS25_CropControlOverride.zip \
            modDesc.xml icon_CropControlOverride.dds gui l10n scripts templates modSettings docs \
            -x '*.DS_Store' '*__MACOSX*' 'docs/examples/*'

          python - <<'PY'
          import zipfile
          import xml.etree.ElementTree as ET
          with zipfile.ZipFile('FS25_CropControlOverride.zip', 'r') as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise SystemExit('Corrupt ZIP member: ' + bad)
              required = {
                  'modDesc.xml', 'icon_CropControlOverride.dds',
                  'gui/CropControlOverrideMenu.xml',
                  'scripts/CropControlOverride.lua',
                  'scripts/CropCalendarManager.lua',
                  'scripts/RegionalProfileManager.lua',
                  'scripts/CCOIntegrationApi.lua',
                  'templates/customRegionalProfile.xml',
              }
              names = set(archive.namelist())
              missing = sorted(required - names)
              if missing:
                  raise SystemExit('Missing package files: ' + ', '.join(missing))
              root = ET.fromstring(archive.read('modDesc.xml'))
              if root.findtext('version') != '2.1.0.0':
                  raise SystemExit('Unexpected packaged modDesc version')
          PY
          sha256sum FS25_CropControlOverride.zip

      - name: Publish or refresh GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi

          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            gh release edit "$RELEASE_VERSION" --title "$RELEASE_TITLE" --notes-file "$NOTES_FILE" "${flags[@]}"
            gh release upload "$RELEASE_VERSION" FS25_CropControlOverride.zip --clobber
          else
            gh release create "$RELEASE_VERSION" FS25_CropControlOverride.zip \
              --target "$TARGET_REF" --title "$RELEASE_TITLE" --notes-file "$NOTES_FILE" "${flags[@]}"
          fi
