name: Apply CCO 2.0.3.6 hotfix

on:
  push:
    branches:
      - hotfix/2.0.3.6
    paths:
      - .github/workflows/apply-cco-2036-hotfix.yml

permissions:
  contents: write

jobs:
  apply-hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@v5
        with:
          ref: hotfix/2.0.3.6

      - name: Apply exact Lua hotfix patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .cco-hotfix-lua.patch
          git apply .cco-hotfix-lua.patch
          rm -f .cco-hotfix-lua.patch
          rm -f .github/workflows/apply-cco-2036-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/CropControlOverride.lua .cco-hotfix-lua.patch .github/workflows/apply-cco-2036-hotfix.yml
          git commit -m "Fix MP seeder sync and SowMission crop recovery"
          git push origin HEAD:hotfix/2.0.3.6
